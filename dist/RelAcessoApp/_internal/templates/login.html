<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – RelAcesso ReportsWeb</title>
  <meta name="description" content="Acesso ao Sistema de Relatórios ReportsWeb">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    const theme = localStorage.getItem('theme') || 'dark';
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  </script>
</head>
<body>
<div class="login-page">

  <!-- Flash messages -->
  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}
  <div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);width:380px;z-index:999;">
    {% for cat, msg in msgs %}
    <div class="alert alert-{{ 'error' if cat=='error' else cat }}" style="box-shadow:var(--shadow-md);">
      <i class="fa-solid fa-circle-info"></i> {{ msg }}
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-img">
        <img src="{{ url_for('static', filename='img/logo.png') }}"
             alt="Rápidonet" style="max-width:200px;width:100%;height:auto;">
      </div>
      <div class="login-divider"></div>
      <div class="login-subtitle">Sistema de Relatórios · ReportsWeb</div>
    </div>

    <!-- Form -->
    <form method="POST" action="{{ url_for('auth.login') }}" id="login-form">
      <div class="form-group">
        <label class="form-label" for="login">Usuário</label>
        <div class="input-wrapper">
          <input class="form-control" type="text" id="login" name="login"
                 placeholder="Digite seu login" autocomplete="username"
                 required autofocus>
          <i class="fa-solid fa-user input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <div class="input-wrapper">
          <input class="form-control" type="password" id="senha" name="senha"
                 placeholder="Digite sua senha" autocomplete="current-password"
                 required>
          <i class="fa-solid fa-lock input-icon"></i>
          <button type="button" id="toggle-pass"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                         background:none;border:none;color:var(--text-muted);cursor:pointer;
                         padding:4px;font-size:13px;">
            <i class="fa-solid fa-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <div class="mt-24">
        <button type="submit" class="btn btn-primary btn-lg" id="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i>
          Entrar no Sistema
        </button>
      </div>
    </form>

    <p class="text-center text-muted mt-16" style="font-size:11px;">
      <i class="fa-solid fa-lock" style="font-size:9px;margin-right:4px;"></i>
      Acesso restrito – ReportsWeb
    </p>
  </div>
</div>

<script>
  // Toggle password visibility
  document.getElementById('toggle-pass').addEventListener('click', () => {
    const inp = document.getElementById('senha');
    const ico = document.getElementById('eye-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      ico.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      inp.type = 'password';
      ico.classList.replace('fa-eye-slash', 'fa-eye');
    }
  });

  // Loading state on submit
  document.getElementById('login-form').addEventListener('submit', () => {
    const btn = document.getElementById('btn-login');
    btn.innerHTML = '<span class="spinner"></span> Entrando…';
    btn.disabled = true;
  });
</script>
</body>
</html>
